<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cillian Ó Murchú | Creative Engineer</title>
    <!-- Page colour per mode: --surface-page in src/index.css. -->
    <meta name="theme-color" content="#FBFAF7" />
    <!-- Applies the saved light/dark mode before first paint (see components/ThemeSwitcher). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("portfolio-theme") === "dark") {
            document.documentElement.dataset.theme = "dark";
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#121110");
          }
        } catch (e) {
          // Storage blocked: stay in light mode.
        }
      })();
    </script>
    <meta
      name="description"
      content="Portfolio of Cillian Ó Murchú, creative engineer."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
